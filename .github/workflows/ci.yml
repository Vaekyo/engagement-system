name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engage
          POSTGRES_PASSWORD: engage
          POSTGRES_DB: engagement_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U engage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://engage:engage@localhost:5432/engagement_test?schema=public
      TEST_DATABASE_URL: postgresql://engage:engage@localhost:5432/engagement_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
